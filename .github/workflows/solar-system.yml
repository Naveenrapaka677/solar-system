name: Solar System Workflow

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'
env:
    MONGO_URI: 'mongodb+srv://supercluster.d83jj.mongodb.net/superData'
    MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
    MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
jobs:
    unit-testing:
       name: Unit Testing
       strategy:
          matrix:
              nodejs_verison: [20]
              os: [ubuntu-latest]
              # exclude:
              #     - nodejs_verison: [20]
              #       os: ubuntu-latest
       runs-on: ${{ matrix.os }}
       steps:
       - name: checkout repository
         uses: actions/checkout@v4
      
       - name: Setup nodejs version - ${{ matrix.nodejs_verison }}
         uses: actions/setup-node@v3
         with:
           node-version: ${{ matrix.nodejs_verison }}

       - name: cache npm Dependencies
         uses: actions/cache@v4
         with:
           path: ~/.npm
           key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

       - name: Install Dependencies
         run: npm install

       - name: Unit Testing
         run: npm test

       - name: archive test results
         uses: actions/upload-artifact@v4
         with:
             name: mocha-test-results
             path: test-results.xml

    code-coverage:
       name: code coverage
       needs: unit-testing
       runs-on: ubuntu-latest
       steps:
       - name: checkout repository
         uses: actions/checkout@v4

       - name: setup nodejs version - 18
         uses: actions/setup-node@v4
         with:
            node-version: 18

       - name: cache npm Dependencies
         uses: actions/cache@v4
         with:
           path: ~/.npm
           key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

       - name: install Dependencies
         run: npm install

       - name: check code coverage
         continue-on-error: true
         run: npm run coverage

       - name: archive test results
         uses: actions/upload-artifact@v4
         with:
           name: code-coverage-result
           path: coverage
           retention-days: 5

    docker:

      name: containerization
      needs: [code-coverage]
      permissions:
          # contents: read 
          packages: write
      runs-on: ubuntu-latest
      steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        - name: Dockerhub login 
          uses: docker/login-action@v2.2.0
          with:
            username: ${{ vars.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_PASSWORD }}

        - name: GHCR login 
          uses: docker/login-action@v2.2.0
          with:
            registry: ghcr.io
            username: ${{ github.repository_owner }}
            password: ${{ secrets.GITHUB_TOKEN }}
      
        - name: Docker Build for testing
          uses: docker/build-push-action@v4
          with:
            context: .
            push: false
            tags: ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}

        - name: Docker Image Test
          run: |
            docker images
            docker run --name solar-system-app -d \
            -p 3000:3000 \
            -e MONGO_URI=$MONGO_URI \
            -e MONGO_USERNAME=$MONGO_USERNAME \
            -e MONGO_PASSWORD=$MONGO_PASSWORD \
            ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha}}
           
            export IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' solar-system-app)
            echo $IP
          
            echo Testing Image URI using wget
            wget -q -O - 127.0.0.1:3000/live | grep live 

        - name: Container Registry Push
          uses: docker/build-push-action@v4
          with:
            context: .
            push: true
            tags: |
              ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}
              ghcr.io/naveenrapaka677/solar-system:${{ github.sha }}

    dev-deploy:
      if: contains(github.ref, 'feature/')
      needs: docker
      uses: ./.github/workflows/reuse-deployment.yml
        

    Dev-Integration-Test:
      if: contains(github.ref, 'feature/')
      name: Dev Integration testing
      needs: dev-deploy
      runs-on:
        - self-hosted
        - Linux

      steps:
        - name: Verify Output
          run: |
            echo "Ingress URL: ${{ needs.dev-deploy.outputs.APP_INGRESS_URL }}"

        - name: Test URL output
          env:
            URL: ${{ needs.dev-deploy.outputs.APP_INGRESS_URL }}
          run: |
            echo "Testing URL: https://$URL/live"

            RESPONSE=$(curl -k -s \
              -H "Host: $URL" \
               https://127.0.0.1/live)

            echo "Response: $RESPONSE"

            STATUS=$(echo "$RESPONSE" | jq -r '.status')

            echo "Status: $STATUS"

            if [ "$STATUS" != "live" ]; then
              echo "Application is not live."
              exit 1
            fi

            echo "Integration Test Passed."

    prod-deploy:
      if: github.ref == 'refs/heads/main'
      needs: docker
      uses: ./.github/workflows/reuse-deployment.yml   

    prod-Integration-Test:
      if: github.ref == 'refs/heads/main'
      name: prod Integration  testing
      needs: prod-deploy
      runs-on:
        - self-hosted
        - Linux

      steps:
        - name: Verify output
          run: |
            echo "Ingress URL: ${{ needs.production-deploy.outputs.APP_INGRESS_URL }}"

        - name: Test URL Output
          env:
            URL: ${{ needs.production-deploy.outputs.APP_INGRESS_URL }}
          run: |
            echo "Testing URL: https://$URL/live"

            RESPONSE=$(curl -k -s \
              -H "Host: $URL" \
               https://127.0.0.1/live)

            echo "Response: $RESPONSE"

            STATUS=$(echo "$RESPONSE" | jq -r '.status')

            echo "Status: $STATUS"

            if [ "$STATUS" != "live" ]; then
              echo "Application is not live."
              exit 1
            fi

            echo "Integration Test Passed."