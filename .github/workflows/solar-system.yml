name: Solar System Workflow

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'
env:
    MONGO_URI: 'mongodb+srv://supercluster.d83jj.mongodb.net/superData'
    MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
    MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
jobs:
    unit-testing:
       name: Unit Testing
       strategy:
          matrix:
              nodejs_verison: 20
              os: [ubuntu-latest]
              # exclude:
              #     - nodejs_verison: [20]
              #       os: ubuntu-latest
       runs-on: ${{ matrix.os }}
       steps:
       - name: checkout repository
         uses: actions/checkout@v4
      
       - name: Setup nodejs version - ${{ matrix.nodejs_verison }}
         uses: actions/setup-node@v3
         with:
           node-version: ${{ matrix.nodejs_verison }}

       - name: cache npm Dependencies
         uses: actions/cache@v4
         with:
           path: ~/.npm
           key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

       - name: Install Dependencies
         run: npm install

       - name: Unit Testing
         run: npm test

       - name: archive test results
         uses: actions/upload-artifact@v4
         with:
             name: mocha-test-results
             path: test-results.xml

    code-coverage:
       name: code coverage
      #needs: unit-testing
       runs-on: ubuntu-latest
       steps:
       - name: checkout repository
         uses: actions/checkout@v4

       - name: setup nodejs version - 18
         uses: actions/setup-node@v4
         with:
            node-version: 18

       - name: cache npm Dependencies
         uses: actions/cache@v4
         with:
           path: ~/.npm
           key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

       - name: install Dependencies
         run: npm install

       - name: check code coverage
         continue-on-error: true
         run: npm run coverage

       - name: archive test results
         uses: actions/upload-artifact@v4
         with:
           name: code-coverage-result
           path: coverage
           retention-days: 5

    docker:

      name: Containerization
      needs: [unit-testing, code-coverage]
      permissions:
          # contents: read 
          packages: write
      runs-on: ubuntu-latest
      steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        - name: Dockerhub login 
          uses: docker/login-action@v2.2.0
          with:
            username: ${{ vars.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_PASSWORD }}

        - name: GHCR login 
          uses: docker/login-action@v2.2.0
          with:
            registry: ghcr.io
            username: ${{ github.repository_owner }}
            password: ${{ secrets.GITHUB_TOKEN }}
      
        - name: Docker Build for testing
          uses: docker/build-push-action@v4
          with:
            context: .
            push: false
            tags: ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}

        - name: Docker Image Test
          run: |
            docker images
            docker run --name solar-system-app -d \
            -p 3000:3000 \
            -e MONGO_URI=$MONGO_URI \
            -e MONGO_USERNAME=$MONGO_USERNAME \
            -e MONGO_PASSWORD=$MONGO_PASSWORD \
            ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha}}
           
            export IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' solar-system-app)
            echo $IP
          
            echo Testing Image URI using wget
            wget -q -O - 127.0.0.1:3000/live | grep live 

        - name: Container Registry Push
          uses: docker/build-push-action@v4
          with:
            context: .
            push: true
            tags: |
              ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}
              ghcr.io/naveenrapaka677/solar-system:${{ github.sha }}

    dev-deploy:
      needs: docker
      runs-on: self-hosted

      steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        - name: Verify Kubernetes
          run: |
            kubectl version
            kubectl config current-context
            kubectl get nodes

        - name: Save NGINX Controller IP
          run: |
            $ip = kubectl -n ingress-nginx get svc ingress-nginx-controller -o jsonpath="{.status.loadBalancer.ingress[0].ip}"
            "INGRESS_IP=$ip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        - name: Replace Tokens
          uses: cschleiden/replace-tokens@v1
          with:
            tokenPrefix: '_{_'
            tokenSuffix: '_}_'
            files: '["kubernetes/development/*.yaml"]'
          env:
            NAMESPACE: ${{ vars.NAMESPACE }}
            REPLICAS: ${{ vars.REPLICAS }}
            IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}
            INGRESS_IP: ${{ env.INGRESS_IP }}

        - name: Check Files
          run: |
            cat kubernetes/development/*.yaml

        - name: Create Namespace
          run: |
            kubectl create namespace ${{ vars.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

        - name: Create MongoDB Secret
          run: |
            kubectl -n ${{ vars.NAMESPACE }} create secret generic mongo-db-secret `
            --from-literal=MONGO_URI=${{ env.MONGO_URI }} `
            --from-literal=MONGO_USERNAME=${{ vars.MONGO_USERNAME }} `
            --from-literal=MONGO_PASSWORD=${{ secrets.MONGO_PASSWORD }} `
            --save-config `
            --dry-run=client -o yaml | kubectl apply -f -

        - name: deploy to dev env
          run: |
            kubectl apply -f kubernetes/development