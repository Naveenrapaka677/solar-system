name: Solar System Workflow

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'
env:
    MONGO_URI: 'mongodb+srv://supercluster.d83jj.mongodb.net/superData'
    MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
    MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
jobs:
    unit-testing:
       name: Unit testing
       strategy:
          matrix:
              nodejs_verison: [19, 20]
              os: [ubuntu-latest]
              exclude:
                  - nodejs_verison: [20]
                    os: ubuntu-latest
       runs-on: ${{ matrix.os }}
       steps:
       - name: checkout repository
         uses: actions/checkout@v4
      
       - name: Setup nodejs version - ${{ matrix.nodejs_verison }}
         uses: actions/setup-node@v3
         with:
           node-version: ${{ matrix.nodejs_verison }}

       - name: cache npm Dependencies
         uses: actions/cache@v4
         with:
           path: ~/.npm
           key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

       - name: Install Dependencies
         run: npm install

       - name: Unit Testing
         run: npm test

       - name: archive test results
         uses: actions/upload-artifact@v4
         with:
             name: mocha-test-results
             path: test-results.xml

    code-coverage:
       name: code coverage
      #needs: unit-testing
       runs-on: ubuntu-latest
       steps:
       - name: checkout repository
         uses: actions/checkout@v4

       - name: setup nodejs version - 18
         uses: actions/setup-node@v4
         with:
            node-version: 18

       - name: cache npm Dependencies
         uses: actions/cache@v4
         with:
           path: ~/.npm
           key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

       - name: install Dependencies
         run: npm install

       - name: check code coverage
         continue-on-error: true
         run: npm run coverage

       - name: archive test results
         uses: actions/upload-artifact@v4
         with:
           name: code-coverage-result
           path: coverage
           retention-days: 5

    docker:
      name: containerization
      permissions:
        packages: write

      needs: [unit-testing, code-coverage]
      runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

    # Login to Docker Hub
      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

    # Login to GitHub Container Registry
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

    # Build image for testing
      - name: Docker Build for Testing
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          load: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}

    # Test the image
      - name: Docker Image Test
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          MONGO_USERNAME: ${{ secrets.MONGO_USERNAME }}
          MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
        run: |
          docker images

          docker run --name solar-system-app -d \
          -p 3000:3000 \
          -e MONGO_URI=$MONGO_URI \
          -e MONGO_USERNAME=$MONGO_USERNAME \
          -e MONGO_PASSWORD=$MONGO_PASSWORD \
          ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}

          export IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' solar-system-app)
          echo "Container IP: $IP"

          echo "Waiting for application to start..."
          sleep 10

          echo "Testing /live endpoint..."
          wget -q -O - http://127.0.0.1:3000/live | grep live
          echo "Testing /live endpoint..."
          wget -q -O - http://127.0.0.1:3000/live | grep live

    # Push image to Docker Hub and GitHub Container Registry
      - name: Push Docker Images
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}
            ghcr.io/naveenrapaka677/solar-system:${{ github.sha }}
            