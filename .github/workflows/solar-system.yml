    Slack-notification:
      if: always()
      name: Slack Notification Demo
      needs: [unit-testing, code-coverage, reports-s3]
      continue-on-error: true
      runs-on: ubuntu-latest
      steps:
      - uses: actions/checkout@v4
      - name: Slack Notification 
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_CHANNEL: github-actions-channel 
          SLACK_COLOR: "${{ job.status }}" #specific color like good or ff00ff
          SLACK_MESSAGE: |
            Pipeline Status: *${{ job.status }}*
            Triggered by: ${{ github.actor }}
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Commit Message: ${{ github.event.head_commit.message }}

    docker:

      name: containerization
      needs: [code-coverage]
      permissions:
          # contents: read 
          packages: write
      runs-on: ubuntu-latest
      steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        - name: Dockerhub login 
          uses: docker/login-action@v2.2.0
          with:
            username: ${{ vars.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_PASSWORD }}

        - name: GHCR login 
          uses: docker/login-action@v2.2.0
          with:
            registry: ghcr.io
            username: ${{ github.repository_owner }}
            password: ${{ secrets.GITHUB_TOKEN }}
      
        - name: Docker Build for testing
          uses: docker/build-push-action@v4
          with:
            context: .
            push: false
            tags: ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}

        - name: Docker Image Test
          run: |
            docker images
            docker run --name solar-system-app -d \
            -p 3000:3000 \
            -e "MONGO_URI=$MONGO_URI" \
            -e "MONGO_USERNAME=$MONGO_USERNAME" \
            -e "MONGO_PASSWORD=$MONGO_PASSWORD" \
            ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}  
           
            export IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' solar-system-app)
            echo $IP
          
            echo Testing Image URI using wget
            wget -q -O - 127.0.0.1:3000/live | grep live 

        - name: Container Registry Push
          uses: docker/build-push-action@v4
          with:
            context: .
            push: true
            tags: |
              ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}
              ghcr.io/naveenrapaka677/solar-system:${{ github.sha }}

    
    dev-deploy:
      if: contains(github.ref, 'feature/')
      needs: docker
      uses: ./.github/workflows/reuse-deployment.yml
      secrets: 
        mongodb-password: ${{ secrets.MONGO_PASSWORD }}
      with:
        mongodb-uri: ${{ vars.MONGO_URI }}
        environment: development
        k8s-manifest-dir: kubernetes/development/
        

    Dev-Integration-Test:
      if: contains(github.ref, 'feature/')
      name: Dev Integration testing
      needs: dev-deploy
      runs-on:
        - self-hosted
        - Linux

      steps:
        - name: Verify Output
          run: |
            echo "Ingress URL: ${{ needs.dev-deploy.outputs.APP_INGRESS_URL }}"

        - name: Test URL output
          env:
            URL: ${{ needs.dev-deploy.outputs.APP_INGRESS_URL }}
          run: |
            echo "Testing URL: https://$URL/live"

            RESPONSE=$(curl -k -s \
              -H "Host: $URL" \
               https://127.0.0.1/live)

            echo "Response: $RESPONSE"

            STATUS=$(echo "$RESPONSE" | jq -r '.status')

            echo "Status: $STATUS"

            if [ "$STATUS" != "live" ]; then
              echo "Application is not live."
              exit 1
            fi

            echo "Integration Test Passed."

    prod-deploy:
      if: github.ref == 'refs/heads/main'
      needs: docker
      uses: ./.github/workflows/reuse-deployment.yml
      secrets: 
        mongodb-password: ${{ secrets.MONGO_PASSWORD }} 
      with:
        mongodb-uri: ${{ vars.MONGO_URI }}  
        environment: production
        k8s-manifest-dir: kubernetes/production/

    prod-Integration-Test:
      if: github.ref == 'refs/heads/main'
      name: prod Integration  testing
      needs: prod-deploy
      runs-on:
        - self-hosted
        - Linux

      steps:
        - name: Verify output
          run: |
            echo "Ingress URL: ${{ needs.prod-deploy.outputs.APP_INGRESS_URL }}"

        - name: Test URL Output
          env:
            URL: ${{ needs.prod-deploy.outputs.APP_INGRESS_URL }}
          run: |
            echo "Testing URL: https://$URL/live"

            RESPONSE=$(curl -k -s \
              -H "Host: $URL" \
               https://127.0.0.1/live)

            echo "Response: $RESPONSE"

            STATUS=$(echo "$RESPONSE" | jq -r '.status')

            echo "Status: $STATUS"

            if [ "$STATUS" != "live" ]; then
              echo "Application is not live."
              exit 1
            fi

            echo "Integration Test Passed."