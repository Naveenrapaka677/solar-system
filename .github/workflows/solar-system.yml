name: Solar System Workflow

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'
env:
    MONGO_URI: 'mongodb+srv://supercluster.d83jj.mongodb.net/superData'
    MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
    MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
jobs:
    unit-testing:
       name: Unit Testing
       strategy:
          matrix:
              nodejs_verison: [20]
              os: [ubuntu-latest]
              # exclude:
              #     - nodejs_verison: [20]
              #       os: ubuntu-latest
       runs-on: ${{ matrix.os }}
       steps:
       - name: checkout repository
         uses: actions/checkout@v4
      
       - name: Setup nodejs version - ${{ matrix.nodejs_verison }}
         uses: actions/setup-node@v3
         with:
           node-version: ${{ matrix.nodejs_verison }}

       - name: cache npm Dependencies
         uses: actions/cache@v4
         with:
           path: ~/.npm
           key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

       - name: Install Dependencies
         run: npm install

       - name: Unit Testing
         run: npm test

       - name: archive test results
         uses: actions/upload-artifact@v4
         with:
             name: mocha-test-results
             path: test-results.xml

    code-coverage:
       name: code coverage
       needs: unit-testing
       runs-on: ubuntu-latest
       steps:
       - name: checkout repository
         uses: actions/checkout@v4

       - name: setup nodejs version - 18
         uses: actions/setup-node@v4
         with:
            node-version: 18

       - name: cache npm Dependencies
         uses: actions/cache@v4
         with:
           path: ~/.npm
           key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

       - name: install Dependencies
         run: npm install

       - name: check code coverage
         continue-on-error: true
         run: npm run coverage

       - name: archive test results
         uses: actions/upload-artifact@v4
         with:
           name: code-coverage-result
           path: coverage
           retention-days: 5

    docker:

      name: containerization
      needs: [code-coverage]
      permissions:
          # contents: read 
          packages: write
      runs-on: ubuntu-latest
      steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        - name: Dockerhub login 
          uses: docker/login-action@v2.2.0
          with:
            username: ${{ vars.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_PASSWORD }}

        - name: GHCR login 
          uses: docker/login-action@v2.2.0
          with:
            registry: ghcr.io
            username: ${{ github.repository_owner }}
            password: ${{ secrets.GITHUB_TOKEN }}
      
        - name: Docker Build for testing
          uses: docker/build-push-action@v4
          with:
            context: .
            push: false
            tags: ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}

        - name: Docker Image Test
          run: |
            docker images
            docker run --name solar-system-app -d \
            -p 3000:3000 \
            -e MONGO_URI=$MONGO_URI \
            -e MONGO_USERNAME=$MONGO_USERNAME \
            -e MONGO_PASSWORD=$MONGO_PASSWORD \
            ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha}}
           
            export IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' solar-system-app)
            echo $IP
          
            echo Testing Image URI using wget
            wget -q -O - 127.0.0.1:3000/live | grep live 

        - name: Container Registry Push
          uses: docker/build-push-action@v4
          with:
            context: .
            push: true
            tags: |
              ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}
              ghcr.io/naveenrapaka677/solar-system:${{ github.sha }}

    dev-deploy:
      if: contains(github.ref, 'feature/')
      name: Deploy to Development
      needs: docker
      runs-on: self-hosted

      outputs:
        APP_INGRESS_URL: ${{ steps.set-ingress-host-address.outputs.APP_INGRESS_HOST }}

      steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        - name: Verify Kubernetes
          run: |
            kubectl version
            kubectl config current-context
            kubectl get nodes
            minikube status

        - name: Save Minikube IP
          run: |
            IP=$(minikube ip)
            echo "INGRESS_IP=$IP" >> "$GITHUB_ENV"
            echo "Minikube IP: $IP"

        - name: Replace Tokens
          uses: cschleiden/replace-tokens@v1
          with:
            tokenPrefix: '${'
            tokenSuffix: '}'
            files: '["kubernetes/development/*.yaml"]'
          env:
            NAMESPACE: ${{ vars.NAMESPACE }}
            REPLICAS: ${{ vars.REPLICAS }}
            K8S_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}
            INGRESS_IP: ${{ env.INGRESS_IP }}

        - name: Check Kubernetes Manifests
          run: |
            cat kubernetes/development/*.yaml

        - name: Create Namespace
          run: |
            kubectl create namespace ${{ vars.NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

        - name: Create MongoDB Secret
          run: |
            kubectl -n ${{ vars.NAMESPACE }} create secret generic mongo-db-secret \
            --from-literal=MONGO_URI="${{ env.MONGO_URI }}" \
            --from-literal=MONGO_USERNAME="${{ vars.MONGO_USERNAME }}" \
            --from-literal=MONGO_PASSWORD="${{ secrets.MONGO_PASSWORD }}" \
            --dry-run=client -o yaml | kubectl apply -f -

        - name: Deploy Application
          run: |
            kubectl apply -f kubernetes/development

        - name: Wait for Deployment
          run: |
            kubectl rollout status deployment/solar-system \
            -n ${{ vars.NAMESPACE }} --timeout=180s

        - name: Verify Resources
          run: |
            kubectl get all -n ${{ vars.NAMESPACE }}
            kubectl get ingress -n ${{ vars.NAMESPACE }}

        - name: Set App Ingress Host
          id: set-ingress-host-address
          run: |
            APP_HOST=$(kubectl -n ${{ vars.NAMESPACE }} get ingress -o jsonpath='{.items[0].spec.rules[0].host}')

            echo "Application Host: $APP_HOST"
  
            echo "APP_INGRESS_HOST=$APP_HOST" >> "$GITHUB_OUTPUT"

    Dev-Integration-Test:
      if: contains(github.ref, 'feature/')
      name: Dev Integration testing
      needs: dev-deploy
      runs-on:
        - self-hosted
        - Linux

      steps:
        - name: Verify Output
          run: |
            echo "Ingress URL: ${{ needs.dev-deploy.outputs.APP_INGRESS_URL }}"

        - name: Test URL output
          env:
            URL: ${{ needs.dev-deploy.outputs.APP_INGRESS_URL }}
          run: |
            echo "Testing URL: https://$URL/live"

            RESPONSE=$(curl -k -s "https://$URL/live")

            echo "Response: $RESPONSE"

            STATUS=$(echo "$RESPONSE" | jq -r '.status')

            echo "Status: $STATUS"

            if [ "$STATUS" != "live" ]; then
              echo "Application is not live."
              exit 1
            fi

            echo "Integration Test Passed."

    Prod-deploy:
      if: github.ref == 'refs/heads/main'
      name: Deploy to production
      needs: docker
      runs-on: self-hosted

      outputs:
        APP_INGRESS_URL: ${{ steps.set-ingress-host-address.outputs.APP_INGRESS_HOST }}

      steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        - name: Verify Kubernetes
          run: |
            kubectl version
            kubectl config current-context
            kubectl get nodes
            minikube status

        - name: Save Minikube IP
          run: |
            IP=$(minikube ip)
            echo "INGRESS_IP=$IP" >> "$GITHUB_ENV"
            echo "Minikube IP: $IP"

        - name: Replace Tokens
          uses: cschleiden/replace-tokens@v1
          with:
            tokenPrefix: '${'
            tokenSuffix: '}'
            files: '["kubernetes/development/*.yaml"]'
          env:
            NAMESPACE: ${{ vars.NAMESPACE }}
            REPLICAS: ${{ vars.REPLICAS }}
            K8S_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}
            INGRESS_IP: ${{ env.INGRESS_IP }}

        - name: Check Kubernetes Manifests
          run: |
            cat kubernetes/development/*.yaml

        - name: Create Namespace
          run: |
            kubectl create namespace ${{ vars.NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

        - name: Create MongoDB Secret
          run: |
            kubectl -n ${{ vars.NAMESPACE }} create secret generic mongo-db-secret \
            --from-literal=MONGO_URI="${{ env.MONGO_URI }}" \
            --from-literal=MONGO_USERNAME="${{ vars.MONGO_USERNAME }}" \
            --from-literal=MONGO_PASSWORD="${{ secrets.MONGO_PASSWORD }}" \
            --dry-run=client -o yaml | kubectl apply -f -

        - name: Deploy Application
          run: |
            kubectl apply -f kubernetes/development

        - name: Wait for Deployment
          run: |
            kubectl rollout status deployment/solar-system \
            -n ${{ vars.NAMESPACE }} --timeout=180s

        - name: Verify Resources
          run: |
            kubectl get all -n ${{ vars.NAMESPACE }}
            kubectl get ingress -n ${{ vars.NAMESPACE }}

        - name: Set App Ingress Host
          id: set-ingress-host-address
          run: |
            APP_HOST=$(kubectl -n ${{ vars.NAMESPACE }} get ingress -o jsonpath='{.items[0].spec.rules[0].host}')

            echo "Application Host: $APP_HOST"
  
            echo "APP_INGRESS_HOST=$APP_HOST" >> "$GITHUB_OUTPUT"   

    Prod-Integration-Test:
      if: github.ref == 'refs/heads/main'
      name: Prod Integration testing
      needs: Prod-deploy
      runs-on:
        - self-hosted
        - Linux

      steps:
        - name: Verify Output
          run: |
            echo "Ingress URL: ${{ needs.dev-deploy.outputs.APP_INGRESS_URL }}"

        - name: Test URL Output
          env:
            URL: ${{ needs.dev-deploy.outputs.APP_INGRESS_URL }}
          run: |
            echo "Testing URL: https://$URL/live"

            RESPONSE=$(curl -k -s "https://$URL/live")

            echo "Response: $RESPONSE"

            STATUS=$(echo "$RESPONSE" | jq -r '.status')

            echo "Status: $STATUS"

            if [ "$STATUS" != "live" ]; then
              echo "Application is not live."
              exit 1
            fi

            echo "Integration Test Passed."     